<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>باك أوفيس ماسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--border:#e2e5ea;--text:#15171c;--muted:#5f6773;--faint:#8b929d;
  --accent:#6d28d9;--accent-2:#efe8fd;--accent-text:#fff;
  --ok:#157a3d;--ok-bg:#e4f4e9;--warn:#9a5300;--warn-bg:#fdf0db;--bad:#b42318;--bad-bg:#fdeceb;--info:#1f4fd1;--info-bg:#e7eefd;--neutral-bg:#eceef2;
  --train:#8b5cf6;--ride:#3b82f6;--taxi:#d4a20a;--rental:#16a34a;--meal:#ea6c0a;--extra:#64748b;
  --hhr-bg:#f4ebd3;--hhr:#7a5a12;--east-bg:#e1edf8;--east:#1d5a8a;--north-bg:#e3f2ea;--north:#1f6b45;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115;--surface:#171a20;--surface-2:#1e222a;--border:#2a2f39;--text:#e8eaee;--muted:#a3aab5;--faint:#7c8492;
    --accent:#a78bfa;--accent-2:#2a2342;--accent-text:#14111f;
    --ok:#4ade80;--ok-bg:#12301d;--warn:#fbbf24;--warn-bg:#342a10;--bad:#f87171;--bad-bg:#3a1717;--info:#93b4ff;--info-bg:#17223d;--neutral-bg:#252a33;
    --hhr-bg:#3a3018;--hhr:#e8c878;--east-bg:#14283a;--east:#8cc2ee;--north-bg:#143021;--north:#86d8ac;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#171a20;--surface-2:#1e222a;--border:#2a2f39;--text:#e8eaee;--muted:#a3aab5;--faint:#7c8492;
  --accent:#a78bfa;--accent-2:#2a2342;--accent-text:#14111f;
  --ok:#4ade80;--ok-bg:#12301d;--warn:#fbbf24;--warn-bg:#342a10;--bad:#f87171;--bad-bg:#3a1717;--info:#93b4ff;--info-bg:#17223d;--neutral-bg:#252a33;
  --hhr-bg:#3a3018;--hhr:#e8c878;--east-bg:#14283a;--east:#8cc2ee;--north-bg:#143021;--north:#86d8ac;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1{font-size:20px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:600}
h4{font-size:13px;margin:14px 0 8px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .xs{font-size:12px} .b{font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;font-size:12.5px}
.money{white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.mb{margin-bottom:16px} .mb-s{margin-bottom:10px} .mt{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{font-family:system-ui,sans-serif;font-weight:900;font-size:20px;letter-spacing:-1px;direction:ltr}
.mock-pill{font-size:11.5px;background:var(--warn-bg);color:var(--warn);padding:2px 10px;border-radius:999px;font-weight:600}
.spacer{flex:1}
.top input{width:230px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;direction:ltr}
.menu-btn{display:none}
.top label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 57px)}
nav{background:var(--surface);border-inline-end:1px solid var(--border);padding:10px 8px 24px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.ng{font-size:11.5px;color:var(--faint);margin:14px 10px 4px;font-weight:600}
.nl{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:start;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--text)}
.nl:hover{background:var(--surface-2)}
.nl.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.nl .cnt{font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:0 7px}
main{padding:20px 22px 60px;min-width:0}
.nav-bd{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;top:0;inset-inline-start:0;height:100vh;width:260px;z-index:45;transform:translateX(105%);transition:transform .2s ease}
  body.nav-open nav{transform:none}
  body.nav-open .nav-bd{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44}
  .menu-btn{display:inline-flex}
  main{padding:16px 16px 60px}
  .top input{width:100%;order:10}
  .top .hide-s{display:none}
}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gside{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.gst{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:1150px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.g2,.g3,.gside,.gst{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi-l{color:var(--muted);font-size:12px}
.kpi-v{font-size:clamp(17px,1.5vw,22px);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;unicode-bidi:plaintext;text-align:start;overflow:hidden;text-overflow:ellipsis}
.kpi-s{font-size:12px;color:var(--faint)}
.kpi.bad .kpi-v{color:var(--bad)} .kpi.warn .kpi-v{color:var(--warn)} .kpi.ok .kpi-v{color:var(--ok)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.info{background:var(--info-bg);color:var(--info)} .badge.accent{background:var(--accent-2);color:var(--accent)}
.lchip{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:600;white-space:nowrap}
.lchip.HHR{background:var(--hhr-bg);color:var(--hhr)} .lchip.EAST{background:var(--east-bg);color:var(--east)} .lchip.NORTH{background:var(--north-bg);color:var(--north)}
.tag{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}
.src{font-size:11px;color:var(--ok);white-space:nowrap} .assume{font-size:11px;color:var(--warn);white-space:nowrap}

.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-weight:600;color:var(--muted);background:var(--surface-2);padding:8px 12px;white-space:nowrap;font-size:12px}
td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:middle}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-2)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;line-height:1.5}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.okb{color:var(--ok)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-width:0;max-width:100%}
input[type=number]{width:96px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{width:100%;min-height:64px;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search]{width:260px}
@media (max-width:900px){.filters input[type=search]{width:100%}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);padding:4px 12px;border-radius:999px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}

.legs{display:inline-flex;gap:3px;align-items:center}
.lg{width:18px;height:6px;border-radius:3px;display:inline-block}
.lg.train{background:var(--train)} .lg.ride{background:var(--ride)} .lg.taxi{background:var(--taxi)} .lg.rental{background:var(--rental)} .lg.meal{background:var(--meal)} .lg.extra{background:var(--extra)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

.lbar{display:flex;align-items:center;gap:8px;min-width:120px}
.track{flex:1;height:6px;background:var(--neutral-bg);border-radius:4px;overflow:hidden;min-width:60px}
.fill{height:100%;border-radius:4px}
.fill.ok{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)} .fill.acc{background:var(--accent)}
.lbar span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}

.callout{background:var(--accent-2);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.callout ol{margin:8px 0 0;padding-inline-start:20px}
.callout li{margin:2px 0}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.note b{color:var(--text)}
.warnbox{background:var(--warn-bg);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12.5px}
.badbox{background:var(--bad-bg);border-radius:10px;padding:10px 12px;font-size:12.5px}
.okbox{background:var(--ok-bg);border-radius:10px;padding:10px 12px;font-size:12.5px}

.alerts{display:grid;gap:6px}
.alert{display:flex;align-items:center;gap:10px;text-align:start;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer}
.alert:hover{background:var(--surface-2)}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.alert.warn .dot{background:var(--warn)} .alert.bad .dot{background:var(--bad)} .alert.info .dot{background:var(--info)}
.alert span.t{flex:1;display:flex;flex-direction:column}
.alert small{color:var(--muted);font-size:12px}
.alert .go{color:var(--faint)}
.integ{display:grid;gap:4px}
.integ div{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--border)}
.integ div:last-child{border-bottom:0}
.integ .n{flex:1}
.sd{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sd.warn{background:var(--warn)} .sd.bad{background:var(--bad)}

.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.form label select,.form label input{width:100%}
.form label input[type=number]{width:140px}

.steps{display:grid;gap:8px;margin-top:12px}
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--neutral-bg);display:grid;place-items:center;font-size:12px;flex:none}
.step.done .n{background:var(--ok);color:#fff}
.step.skip{opacity:.55}
.step .t{flex:1;display:flex;flex-direction:column}
.step .t small{color:var(--muted);font-size:12px}
.dcard{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--surface);margin-bottom:14px}
.dcard.active{border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.ikpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.ikpi{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.ikpi b{display:block;font-size:17px}
.ikpi span{font-size:11.5px;color:var(--muted)}

/* drawer */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer-bd{position:absolute;inset:0;background:rgba(10,12,16,.38)}
.drawer-panel{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(660px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.drawer-head h2{font-size:16px;margin:0}
.drawer-body{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.sec h3{margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.leg{border:1px solid var(--border);border-inline-start:4px solid var(--c,var(--border));border-radius:10px;padding:10px 12px;background:var(--surface);display:grid;gap:3px;font-size:13px}
.leg.train{--c:var(--train)} .leg.ride{--c:var(--ride)} .leg.taxi{--c:var(--taxi)} .leg.rental{--c:var(--rental)} .leg.meal{--c:var(--meal)} .leg.extra{--c:var(--extra)}
.leg-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.journey{display:grid;gap:8px}
.hist{display:grid;gap:0}
.hist div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.hist div:last-child{border-bottom:0}
.hist .w{color:var(--muted)}
.qt td,.qt th{padding:6px 8px}
.stops{list-style:none;margin:0;padding:0}
.stops li{display:flex;align-items:center;gap:10px;padding:6px 0;position:relative}
.stops li .sdot{width:10px;height:10px;border-radius:50%;border:2px solid var(--train);background:var(--surface);flex:none;z-index:1}
.stops li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:4px;top:22px;bottom:-8px;width:2px;background:var(--border)}
.stops li b{flex:1;font-weight:500}
.msgs{display:grid;gap:8px}
.msg{padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;max-width:85%}
.msg.me{background:var(--accent-2);justify-self:end}
.msg small{display:block;color:var(--muted);font-size:11px}

.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.barrow .track{height:10px}
@media (max-width:600px){.barrow{grid-template-columns:90px 1fr auto}}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:start}
.chk{color:var(--ok);font-weight:700} .x{color:var(--faint)}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:start;display:grid;gap:6px}
.pcard:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tpl{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);display:grid;gap:6px}
.tpl p{margin:0;font-size:13px}
.tpl .en{direction:ltr;text-align:left;color:var(--muted);font-size:12px}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--text);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:tin .2s ease}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
s{color:var(--faint)}
.warn-t{color:var(--warn);font-weight:600}
.bad-t{color:var(--bad);font-weight:600}
.ok-t{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <button class="btn sm menu-btn" data-action="toggleNav" aria-label="القائمة">القائمة</button>
  <div class="brand"><span>باك أوفيس ماسي</span><span class="mock-pill">تصور غير رسمي من مصعب · بيانات وهمية</span></div>
  <div class="spacer"></div>
  <input id="gq" type="search" placeholder="بحث سريع: رقم طلب، اسم، جوال، PNR" autocomplete="off">
  <label>الدور <select id="roleSel" data-bind="role"></select></label>
  <button class="btn sm" data-action="theme" aria-label="الوضع">الوضع</button>
  <span class="clock hide-s" id="clock"></span>
</header>
<div class="shell">
  <div class="nav-bd" data-action="toggleNav"></div>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-bd" data-action="closeDrawer"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true">
    <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="btn sm" data-action="closeDrawer">إغلاق</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<div id="toasts"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);

/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(1932);
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;

const TRIPS=[],TRIP={},BY_TRIP={};
function addTrip(line,dir,d,startMin,i){
  const L=LINES[line],total=L.mins[L.mins.length-1];
  const stops=dir?L.stops.slice().reverse():L.stops.slice();
  const mins=dir?L.mins.slice().reverse().map(x=>total-x):L.mins.slice();
  const dep=DAY0+d*DAYMS+startMin*MIN;
  const no=(line==='HHR'?'HHR ':line==='EAST'?'E-':'N-')+((line==='HHR'?1100:line==='EAST'?300:100)+i*2+1+dir);
  const t={id:no.replace(/\s/g,'')+'_'+d,no,line,dir,d,stops,times:mins.map(x=>dep+x*MIN),dep,arr:dep+total*MIN,delay:0,cancelled:false,cap:Object.assign({},CAPS[line]),sold:{},blocked:{},quota:{},soldCh:{},platform:ri(1,line==='HHR'?6:3)};
  for(const c in t.cap){t.sold[c]=0;t.blocked[c]=0;}
  const capTot=sumObj(t.cap),qp=QUOTA_PCT[L.op];
  for(const ch in qp){t.quota[ch]=Math.round(capTot*qp[ch]);t.soldCh[ch]=0;}
  TRIPS.push(t);TRIP[t.id]=t;BY_TRIP[t.id]=[];
}

function rideLeg(p,kind,time,st){const price=p==='BUS'?15:p==='JEENY'?ri(7,18)*5:ri(6,16)*5;return {type:'ride',kind,partner:p,t:time,addr:'حي '+pick(CITY[st]).replace(/^حي /,''),st,price,ref:PARTNERS[p].ref+ri(100000,999999),driver:p==='BUS'?'حافلة رقم '+ri(10,99):pick(MALE)+' '+pick(FAM),plate:p==='BUS'?'':plate(),fail:false,resched:false,cxl:false};}

function mealLeg(n){const items=[];const k=ri(1,Math.min(3,n+1));for(let i=0;i<k;i++){const m=MENU[ri(0,8)];const ex=items.find(x=>x.id===m.id);if(ex)ex.q++;else items.push({id:m.id,q:1});}if(chance(.15))items.push({id:pick(['m9','m10']),q:1});return {type:'meal',items,price:sumBy(items,x=>MENU_BY[x.id].price*x.q),ref:'CAT-'+ri(10000,99999)};}
function extraLeg(n,cls){const items=[];if(chance(.8))items.push({k:'bag',n:'شنطة إضافية',q:ri(1,2),p:50});if(['SBU','SBP','CAB','CAP'].includes(cls)&&chance(.5))items.push({k:'lounge',n:'دخول الصالة',q:n,p:75});if(!items.length)items.push({k:'bag',n:'شنطة إضافية',q:1,p:50});return {type:'extra',items,price:sumBy(items,x=>x.q*x.p)};}
function makeOrder(t,ch,n,cls){
  const op=opOf(t);let a,b;const k=t.stops.length;
  if(ch==='SAUDIA'){const ki=stopIdx(t,'KAIA');if(chance(.5)){a=ki;b=k-1;}else{a=0;b=ki;}}
  else if(chance(.5)){a=0;b=k-1;}else{a=ri(0,k-2);b=ri(a+1,k-1);}
  const from=t.stops[a],to=t.stops[b],dep=t.times[a],arr=t.times[b];
  const intl=(ch==='NUSUK'||ch==='SAUDIA')?chance(.7):(op==='HHR'?chance(.15):chance(.03));
  const name=intl?pick(INTL):(chance(.62)?pick(MALE):pick(FEMALE))+' '+pick(FAM);
  let created=Math.min(NOW()-ri(2,600)*MIN,dep-ri(40,180)*MIN);
  if(ch==='STATION')created=Math.min(NOW()-ri(1,30)*MIN,dep-ri(20,240)*MIN);
  else created-=chance(.6)?ri(0,10)*DAYMS+ri(0,23)*HOUR:ri(0,36)*HOUR;
  const masi=ch==='APP'||ch==='WEB',f=fare(t.line,from,to,cls),legs=[];
  if(masi&&chance(.5)){const p=from==='MKK'&&chance(.3)?'BUS':(chance(.6)?'JEENY':'TAXA');legs.push(rideLeg(p,'first',dep-ri(55,95)*MIN,from));}
  legs.push({type:'train',trip:t.id,cls,from,to,fare:f,price:f*n,pnr:(op==='HHR'?'IND-':'SAR-')+code(6),seat:t.sold[cls]});
  if(masi){if(chance(.08))legs.push(rentalLeg(arr+15*MIN,to));else if(chance(.4))legs.push(rideLeg(chance(.6)?'JEENY':'TAXA','last',arr+ri(8,15)*MIN,to));}

function compTier(m){return m>=240?1:m>=180?.75:m>=120?.5:0;}
function legName(l){if(l.type==='train')return 'تذكرة القطار';if(l.type==='ride')return (l.kind==='first'?'توصيلة إلى المحطة':'توصيلة من المحطة')+' ('+PARTNERS[l.partner].n+')';if(l.type==='rental')return 'تأجير سيارة (تلقاني)';if(l.type==='meal')return 'وجبات ومتجر';return 'إضافات';}
function quoteCancel(o,reason){
  const t=oTrip(o),op=opOf(t),tl=trainLeg(o),n=NOW();
  const depAt=stopTime(t,tl.from),hrs=(depAt-n)/HOUR;
  const lines=[];let allowed=true;
  for(const l of o.legs){
    let fee=0,note='',src='assume';
    if(l.cxl){lines.push({l,label:legName(l),paid:l.price,fee:l.price,refund:0,note:'ملغاة سابقاً',payee:legPayee(l,op),src:''});continue;}
    if(reason==='operator'){note='إلغاء من الناقل: استرداد كامل';src='src';}
    else if(l.type==='train'){
      if(op==='HHR'){src='src';
        if(hrs<1/3){allowed=false;fee=l.price;note='أقل من 20 دقيقة على المغادرة: ممنوع، والتذكرة تضيع';}
        else if(tl.cls==='ECO'){if(hrs>24){fee=l.price*.2;note='اقتصادي، أكثر من 24 ساعة: رسوم 20٪';}else{fee=l.price*.5;note='اقتصادي، أقل من 24 ساعة: رسوم 50٪';}}
        else{if(hrs>24){note='أعمال، أكثر من 24 ساعة: مجاني';}else{fee=l.price*.35;note='أعمال، أقل من 24 ساعة: رسوم 35٪';}}
      }else{
        if(hrs<-24){allowed=false;fee=l.price;note='مضى أكثر من 24 ساعة على الرحلة';src='src';}
        else if(tl.cls==='SAV'){fee=l.price;note='اقتصادي موفّر: غير مسترد';}
        else if(hrs>=24){const r=tl.cls==='SEC'?.15:.10;fee=l.price*r;note=`أكثر من 24 ساعة: رسوم ${r*100}٪`;}
        else{fee=l.price*.5;note='أقل من 24 ساعة: سعر عدم الحضور 50٪';}
      }
    }else if(l.type==='ride'){
      const rs=rideState(l,o);
      if(l.fail){note='التوصيلة فشلت: استرداد كامل';}
      else if(rs==='DONE'||rs==='ENROUTE'){fee=l.price;note='التوصيلة بدأت أو انتهت';}
      else if(l.t-n<HOUR){fee=15;note='أقل من ساعة على الموعد: رسوم 15 ر.س';}
      else note='أكثر من ساعة على الموعد: مجاني';
    }else if(l.type==='rental'){if(l.t-n>24*HOUR)note='أكثر من 24 ساعة: مجاني';else{fee=l.price*.25;note='أقل من 24 ساعة: رسوم 25٪';}}
    else if(l.type==='meal'){if(hrs>3)note='أكثر من 3 ساعات قبل الرحلة: مجاني';else{fee=l.price;note='التموين جهّز الطلب: غير مسترد';}}
    else if(l.type==='extra'){fee=l.price;note='الإضافات المدفوعة مسبقاً غير مستردة';src=op==='SAR'?'src':'assume';}
    fee=Math.min(l.price,r2(fee));
    lines.push({l,label:legName(l),paid:l.price,fee,refund:r2(l.price-fee),note,payee:legPayee(l,op),src});
  }
  return {lines,allowed,total:r2(sumBy(lines,x=>x.refund)),hrs};
}
function changeFee(o,hrs){const tl=trainLeg(o),op=opOf(oTrip(o));if(op==='HHR'){if(hrs<1/3)return null;if(tl.cls==='ECO')return r2(tl.price*(hrs>24?.1:.2));return hrs>24?0:r2(tl.price*.1);}if(hrs<1)return null;return tl.cls==='SAV'?50:0;}
function releaseSeats(o){const tl=trainLeg(o),t=TRIP[tl.trip];t.sold[tl.cls]=Math.max(0,t.sold[tl.cls]-o.pax);t.soldCh[o.ch]=Math.max(0,(t.soldCh[o.ch]||0)-o.pax);}
function moveOrder(o,nt){const tl=trainLeg(o),t=TRIP[tl.trip];releaseSeats(o);BY_TRIP[t.id]=BY_TRIP[t.id].filter(x=>x!==o);const delta=stopTime(nt,tl.from)-stopTime(t,tl.from);tl.seat=nt.sold[tl.cls];nt.sold[tl.cls]+=o.pax;nt.soldCh[o.ch]=(nt.soldCh[o.ch]||0)+o.pax;tl.trip=nt.id;tl.missed=false;BY_TRIP[nt.id].push(o);return delta;}
function anchorRides(o,onlyFuture){const tl=trainLeg(o),t=TRIP[tl.trip];const dep=stopTime(t,tl.from)+t.delay*MIN,arr=stopTime(t,tl.to)+t.delay*MIN;let c=0;o.legs.forEach(l=>{if((l.type!=='ride'&&l.type!=='rental')||l.cxl||l.fail)return;if(onlyFuture&&l.t<=NOW())return;const nt=l.kind==='first'?dep-(l.lead||60*MIN):arr+(l.lag||10*MIN);if(nt!==l.t){l.t=nt;l.resched=true;c++;}});return c;}
function altTrips(o,minLead){const tl=trainLeg(o),t=oTrip(o);return TRIPS.filter(x=>x.id!==t.id&&x.line===t.line&&x.dir===t.dir&&!x.cancelled&&stopTime(x,tl.from)-NOW()>minLead&&avail(x,tl.cls)>=o.pax);}
function seatLabel(t,cls,idx){let base=0;for(const c of Object.keys(t.cap)){if(c===cls)break;base+=Math.ceil(t.cap[c]/PER_COACH[c]);}const per=PER_COACH[cls];return 'عربة '+(base+1+Math.floor(idx/per))+'، مقعد '+(idx%per+1);}
function paxName(o,i){if(i===0)return o.name;const h=hashStr(o.id+':'+i);if(o.intl)return INTL[h%INTL.length];const fem=h%3===0;return (fem?FEMALE[h%FEMALE.length]:MALE[h%MALE.length])+' '+o.name.split(' ').slice(1).join(' ');}

/* ---------- disruptions ---------- */
function dImpact(d){
  const t=TRIP[d.trip],os=d.orders.map(id=>ORDER[id]);
  const pax=sumBy(os,o=>o.pax);
  const last=os.filter(o=>o.legs.some(l=>(l.type==='ride'&&l.kind==='last')||l.type==='rental')).length;
  const first=os.filter(o=>o.legs.some(l=>l.type==='ride'&&l.kind==='first'&&l.t>d.t)).length;
  const saudia=os.filter(o=>o.ch==='SAUDIA').length;
  const tier=d.type==='cancel'?1:compTier(d.mins);
  const comp=r2(sumBy(os,o=>trainLeg(o).price*tier));
  return {t,os,pax,last,first,saudia,tier,comp,refund:r2(sumBy(os,o=>o.total))};
}
function dSteps(d){
  const I=dImpact(d),op=OPS[d.op];
  if(d.type==='cancel'){
    const nx=nextTrip(I.t);
    return [
      {k:'notify',n:'إبلاغ الركاب',s:`${I.os.length+d.holds} طلب عبر SMS والإشعارات`},
      {k:'choice',n:'إعادة الحجز أو الاسترداد',s:nx?`أقرب رحلة: ${nx.no} الساعة ${hhmm(nx.dep)}`:'ما فيه رحلة بديلة اليوم',choice:true},
      {k:'resched',n:d.done.refund?'إلغاء التوصيلات عند الشركاء':'نقل التوصيلات لموعد الرحلة الجديدة',s:`${I.first+I.last} توصيلة`,skip:!(I.first+I.last),need:'choice'},
      {k:'comp',n:'تعويض الإلغاء',s:`100٪ من قيمة التذكرة = ${moneyT(I.comp)}، يتحمّلها ${op}`}
    ];
  }
  return [
    {k:'notify',n:'إبلاغ الركاب',s:`${I.os.length+d.holds} طلب عبر SMS والإشعارات`},
    {k:'resched',n:'إعادة جدولة التوصيلات مع الشركاء',s:`${I.first+I.last} توصيلة عند جيني وتكسا وتلقاني`,skip:!(I.first+I.last)},
    {k:'meals',n:'صرف قسائم وجبات',s:`${I.pax} راكب، لأن التأخير فوق 60 دقيقة`,skip:d.mins<=60},
    {k:'comp',n:'تطبيق التعويض الآلي',s:I.tier?`${I.tier*100}٪ من قيمة التذكرة = ${moneyT(I.comp)}، يتحمّلها ${op}`:'التأخير أقل من ساعتين: ما فيه تعويض مالي',skip:!I.tier}
  ];
}
function stepDone(d,k){if(k==='choice')return !!(d.done.rebook||d.done.refund);return !!d.done[k];}
function dDone(d){if(d.type==='ride')return !!(d.done.rebook&&d.done.comp&&d.done.recover);return dSteps(d).every(s=>s.skip||stepDone(d,s.k));}
function nextTrip(t){return TRIPS.find(x=>x.line===t.line&&x.dir===t.dir&&x.dep>t.dep&&!x.cancelled);}
function rideCandidates(){const n=NOW();return ORDERS.filter(o=>{if(o.st!=='CONF')return false;const r=o.legs[0];if(r.type!=='ride'||r.kind!=='first'||r.fail||r.resched||r.t<=n||trainLeg(o).trip0)return false;const t=oTrip(o);if(t.d>1||t.delay>0||!scopeOk(opOf(t)))return false;const s=tripState(t);return (s==='SCHED'||s==='DELAYED')&&r.t>n-20*MIN;}).sort((a,b)=>a.legs[0].t-b.legs[0].t);}
V.disrupt=function(){
  const u=S.ui.disrupt;
  const trips=TRIPS.filter(t=>t.d<=1&&!t.cancelled&&scopeOk(opOf(t))&&['SCHED','BOARDING','DELAYED'].includes(tripState(t)));
  if(!trips.some(t=>t.id===u.trip))u.trip=(trips.find(t=>t.line==='HHR'&&tripState(t)==='SCHED'&&t.d===0)||trips[0]||{}).id||'';
  let form='',preview='';
  if(u.type==='ride'){
    const c=rideCandidates();
    if(!c.some(o=>o.id===u.order))u.order=c[0]?c[0].id:'';
    form=`<label>الطلب (توصيلة إلى المحطة قبل رحلة قادمة)${sel('ui.disrupt.order',c.slice(0,80).map(o=>{const r=o.legs[0];return [o.id,`${o.id} · ${PARTNERS[r.partner].n} ${hhmm(r.t)} · قطار ${oTrip(o).no} ${hhmm(stopTime(oTrip(o),trainLeg(o).from))}`];}),u.order)}</label><label>تأخر السائق (دقيقة)<input id="f-mins" type="number" min="5" max="180" data-bind="ui.disrupt.mins" value="${esc(u.mins)}"></label>`;
    const o=ORDER[u.order];
    if(o){const r=o.legs[0],t=oTrip(o),tl=trainLeg(o);const arrive=r.t+(+u.mins||0)*MIN+25*MIN,close=stopTime(t,tl.from)+t.delay*MIN-10*MIN;preview=arrive>close?`<div class="badbox">بهذا التأخير يوصل الراكب المحطة ${hhmm(arrive)}، والصعود يقفل ${hhmm(close)}. <b>يفوته القطار.</b></div>`:`<div class="okbox">بهذا التأخير يلحق القطار. زِد التأخير عشان تشوف السيناريو.</div>`;}
  }else{
    form=`<label>الرحلة${sel('ui.disrupt.trip',trips.map(t=>[t.id,tripLabel(t)]),u.trip)}</label>`+(u.type==='delay'?`<label>مدة التأخير (دقيقة)<input id="f-mins" type="number" min="5" max="600" data-bind="ui.disrupt.mins" value="${esc(u.mins)}"></label>`:'')+`<label>السبب${sel('ui.disrupt.reason',REASONS.map(r=>[r,r]),u.reason)}</label>`;
    const t=TRIP[u.trip];
    if(t){const os=BY_TRIP[t.id].filter(o=>o.st==='CONF');const m=+u.mins||0,tier=compTier(m);

function tgaTable(){return table([{h:'الحالة',f:r=>r[0]},{h:'حق الراكب',f:r=>r[1]}],[

function dCard(d){

  <div class="ikpis"><div class="ikpi"><b>${num(I.os.length)}</b><span>طلب متأثر</span></div><div class="ikpi"><b>${num(I.pax)}</b><span>راكب</span></div><div class="ikpi"><b>${num(I.first)}</b><span>توصيلة قبل المغادرة</span></div><div class="ikpi"><b>${num(I.last)}</b><span>توصيلة أو تأجير بعد الوصول</span></div><div class="ikpi"><b>${num(I.saudia)}</b><span>مرتبطين برحلة طيران</span></div><div class="ikpi"><b>${moneyT(d.type==='cancel'?I.comp:I.comp)}</b><span>تكلفة التعويض</span></div></div>
  <div class="note"><b>مين يتحمّل؟</b> ${OPS[d.op]} (الناقل)، لأن السبب عنده. ماسي تصرف للعميل لأنها نقطة التواصل الوحيدة، وتخصم المبلغ من مستحقات ${OPS[d.op]} في التسويات.</div>
  <div class="steps">${steps.map((s,i)=>{const ok=stepDone(d,s.k);const blocked=s.need&&!stepDone(d,s.need);
    let btn='';
    if(!ok&&!s.skip){btn=s.choice?`<button class="btn sm pri" data-action="dstep" data-id="${d.id}" data-step="rebook">إعادة حجز</button><button class="btn sm" data-action="dstep" data-id="${d.id}" data-step="refund">استرداد كامل</button>`:`<button class="btn sm pri" data-action="dstep" data-id="${d.id}" data-step="${s.k}" ${blocked?'disabled':''}>نفّذ</button>`;}

}
function stepResult(d,k){if(k==='choice'&&d.done.rebook)return `انتقل ${d.done.rebook.moved} طلب${d.done.rebook.left?'، و'+d.done.rebook.left+' ما لقينا لهم مقاعد':''}`;if(k==='choice'&&d.done.refund)return 'تم استرداد كامل المبالغ';if(k==='resched'&&typeof d.done.resched==='number')return d.done.resched+' توصيلة تعدّلت';return '';}
function rideCard(d){

function manifest(t,st){const out=[];for(const o of BY_TRIP[t.id]){const tl=trainLeg(o);if(tl.trip!==t.id||tl.from!==st)continue;if(o.st==='CXL'||o.st==='HOLD'||o.st==='EXP')continue;for(let i=0;i<o.pax;i++)out.push({o,i,key:o.id+':'+i,name:paxName(o,i),seat:seatLabel(t,tl.cls,tl.seat+i),cls:tl.cls,to:tl.to});}return out;}
function boarded(p,t){if(p.o.st==='NOSHOW'||trainLeg(p.o).missed)return false;const s=tripState(t);if(s==='RUNNING'||s==='ARRIVED')return true;return S.boarded.has(p.key);}

/* ---------- orders ---------- */
function filterOrders(){

  return ORDERS_DESC.filter(o=>{
    const tl=trainLeg(o),t=TRIP[tl.trip];
    if(!scopeOk(opOf(t)))return false;
    if(u.trip&&tl.trip!==u.trip&&tl.trip0!==u.trip)return false;

}

/* ---------- settlement ---------- */
function settlement(){
  const P={};const get=k=>P[k]||(P[k]={k,gross:0,refunds:0,comp:0,rec:0,fees:0});
  ORDERS.forEach(o=>{if(o.st==='HOLD'||o.st==='EXP')return;const op=opOf(oTrip(o));o.legs.forEach(l=>{get(legPayee(l,op)).gross+=l.price;});});
  S.adj.forEach(a=>{
    if(a.kind==='refund'&&a.split)for(const k in a.split)get(k).refunds+=a.split[k];
    if(a.kind==='comp'||a.kind==='meal')get(a.payer).comp+=a.amount;
    if(a.kind==='recovery')get(a.payer).rec+=a.amount;
    if(a.kind==='fee')get(a.payer).fees+=a.amount;
  });
  const rows=Object.values(P).filter(p=>p.k!=='MASI').map(p=>{const rate=OPS[p.k]?S.trainShare:PARTNERS[p.k].com;const base=p.gross+p.fees-p.refunds;const com=r2(base*rate);return Object.assign(p,{rate,com,net:r2(base-com-p.comp-p.rec)});});
  const gw=sumBy(S.adj.filter(a=>a.kind==='goodwill'),a=>a.amount),cb=sumBy(S.adj.filter(a=>a.kind==='chargeback'),a=>a.amount),rideComp=sumBy(S.adj.filter(a=>a.kind==='comp'&&a.payer==='MASI'),a=>a.amount);
  const recov=sumBy(rows,r=>r.rec);
  const masi={com:sumBy(rows,r=>r.com),gw,cb,rideComp,recov};masi.net=r2(masi.com+recov-gw-cb-rideComp);
  return {rows,masi};
}
V.settle=function(){

    kpis([{l:'إيراد ماسي من العمولات',v:moneyT(masi.com)},{l:'مستردّ من الشركاء',v:moneyT(masi.recov),tone:'ok'},{l:'تعويضات ودّية',v:moneyT(masi.gw),tone:'warn'},{l:'تعويضات على ماسي',v:moneyT(masi.rideComp),tone:'warn'},{l:'نزاعات بنكية',v:moneyT(masi.cb),tone:'bad'},{l:'صافي ماسي',v:moneyT(masi.net)}])+
    table([
      {h:'الجهة',f:r=>`<b>${payeeName(r.k)}</b><div class="xs faint">${OPS[r.k]?'ناقل':PARTNERS[r.k].kind}</div>`},{h:'المبيعات',f:r=>money(r.gross),c:'num'},{h:'رسوم تعديل',f:r=>r.fees?money(r.fees):'0',c:'num'},{h:'الاسترجاع',f:r=>`<span class="bad-t">${moneyT(-r.refunds)}</span>`,c:'num'},
      {h:'عمولة ماسي',f:r=>`${moneyT(-r.com)} <span class="xs faint">${Math.round(r.rate*100)}٪</span>`,c:'num'},{h:'تعويضات عليه',f:r=>r.comp?`<span class="bad-t">${moneyT(-r.comp)}</span>`:'0',c:'num'},{h:'مطالبات عليه',f:r=>r.rec?`<span class="bad-t">${moneyT(-r.rec)}</span>`:'0',c:'num'},
      {h:'الصافي المستحق',f:r=>`<b>${moneyT(r.net)}</b>`,c:'num'},
      {h:'الحالة',f:r=>{const s=S.settle[r.k]||'draft';return badge(ST_S[s][0],ST_S[s][1])+(fin&&s==='draft'?` <button class="btn sm" data-action="settle" data-id="${r.k}" data-to="approved">اعتماد</button>`:'')+(fin&&s==='approved'?` <button class="btn sm pri" data-action="settle" data-id="${r.k}" data-to="paid">تحويل</button>`:'');}}
    ],rows)+

function renderNav(){
  const groups={};MODULES.filter(m=>modAllowed(m.id)).forEach(m=>(groups[m.g]=groups[m.g]||[]).push(m));
  const badgeFor=id=>{if(id==='disrupt'){const n=S.disruptions.filter(d=>!dDone(d)).length;return n?n:'';}if(id==='cs'){const n=S.cases.filter(c=>c.st!=='resolved'&&slaLeft(c)<0).length;return n?n:'';}return '';};
  $('#nav').innerHTML=Object.entries(groups).map(([g,ms])=>`<div class="ng">${g}</div>`+ms.map(m=>{const b=badgeFor(m.id);return `<button class="nl ${S.route===m.id?'on':''}" data-action="go" data-r="${m.id}"><span>${m.n}</span>${b?`<span class="cnt">${b}</span>`:''}</button>`;}).join('')).join('')+
    `<div class="ng">عن النموذج</div><div class="xs muted" style="padding:0 10px">الدور الحالي: <b>${role().n}</b>. النطاق: ${role().scope==='ALL'?'كل الخطوط':OPS[role().scope]}.</div>`;
}
function render(){
  const ae=document.activeElement,fid=ae&&ae.id&&ae.id!=='gq'?ae.id:null;let selr=null;try{if(fid&&ae.selectionStart!=null)selr=[ae.selectionStart,ae.selectionEnd];}catch(e){}
  if(!modAllowed(S.route)){S.route=firstAllowed();history.replaceState(null,'','#'+S.route);}
  renderNav();
  $('#main').innerHTML=V[S.route]();
  if(S.drawer)renderDrawer();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(selr)try{el.setSelectionRange(selr[0],selr[1]);}catch(e){}}}
  tick();
}
function renderDrawer(){

function openDrawer(k,id,keep){S.drawer={k,id};if(!keep)S.draft={block:{}};$('#drawerBody').scrollTop=0;renderDrawer();}

A.saveFares=()=>{audit('اعتماد أسعار جديدة',Object.entries(S.rate).map(([k,v])=>k+':'+v).join(' '));toast('اعتُمدت الأسعار للحجوزات الجديدة');};
A.block=d=>{const t=TRIP[d.id],n=+((S.draft.block||{})[d.cls]||0);if(!n||n<1)return toast('اكتب العدد','bad');if(n>avail(t,d.cls))return toast('العدد أكبر من المتاح','bad');t.blocked[d.cls]+=n;S.draft.block[d.cls]='';audit(`حجب ${n} مقعد ${CLASSES[d.cls]}`,t.no);toast('انحجبت المقاعد');render();};
A.saveQuota=d=>{const t=TRIP[d.id],q={};for(const k in S.draft.q)q[k]=Math.max(0,+S.draft.q[k]||0);if(sumObj(q)>sumObj(t.cap))return toast(`المجموع ${sumObj(q)} أكبر من السعة ${sumObj(t.cap)}`,'bad');t.quota=q;audit('تحديث حصص القنوات',t.no);toast('انحفظت الحصص');render();};
A.caseReply=d=>{const c=S.cases.find(x=>x.id===d.id),m=(S.draft.note||'').trim();if(!m)return toast('اكتب الرد','bad');c.msgs.push({by:role().n,t:NOW(),m});if(c.st==='open')c.st='progress';if(!c.agent)c.agent=role().n;S.draft.note='';audit('رد على حالة',c.id);render();};
A.caseAssign=d=>{const c=S.cases.find(x=>x.id===d.id);c.agent=role().n;c.st='progress';audit('تعيين حالة',c.id);render();};
A.caseEsc=d=>{const c=S.cases.find(x=>x.id===d.id);c.st='escalated';c.esc=d.to;c.msgs.push({by:'النظام',t:NOW(),m:'تصعيد إلى '+payeeName(d.to)});audit('تصعيد إلى '+payeeName(d.to),c.id);toast('تصعّدت الحالة');render();};
A.caseResolve=d=>{const c=S.cases.find(x=>x.id===d.id),r=(S.draft.res||'').trim();if(!r)return toast('اكتب ملخص الحل','bad');c.st='resolved';c.res=r;c.agent=c.agent||role().n;audit('إغلاق حالة',c.id);toast('انقفلت الحالة');render();};
A.payOne=d=>{const a=S.adj.find(x=>x.id===d.id);a.status='paid';audit('صرف '+ADJ_K[a.kind][0]+' '+moneyT(a.amount),a.order);render();};
A.payAll=()=>{let n=0,s=0;S.adj.forEach(a=>{if((a.kind==='refund'||a.kind==='comp'||a.kind==='goodwill')&&a.status==='pending'){a.status='paid';n++;s+=a.amount;}});audit(`صرف جماعي ${n} عملية`,moneyT(s));toast(`انصرف ${n} مبلغ بإجمالي ${moneyT(s)}`);render();};
A.recon=()=>{S.recon.checked=true;audit('حل فرق مطابقة','Apple Pay أمس');toast('العملية كانت في كشف اليوم التالي، والفرق انحل');render();};
A.settle=d=>{S.settle[d.id]=d.to;audit(d.to==='paid'?'تحويل مستحقات':'اعتماد تسوية',payeeName(d.id));render();};
A.userToggle=d=>{const u=S.users.find(x=>x.id===d.id);u.on=!u.on;audit(u.on?'تفعيل مستخدم':'تعطيل مستخدم',u.id);render();};
A.testSend=d=>{notif(d.id,1,'إرسال تجريبي');audit('إرسال تجريبي',TPL(d.id).n);toast('انرسل');render();};

A.simulate=()=>{
  const u=S.ui.disrupt;
  if(u.type==='ride'){
    const o=ORDER[u.order];if(!o)return toast('اختر طلب','bad');
    const r=o.legs[0],tl=trainLeg(o),t=TRIP[tl.trip],mins=Math.max(5,+u.mins||0);
    const arrive=r.t+mins*MIN+25*MIN,close=stopTime(t,tl.from)+t.delay*MIN-10*MIN;
    if(arrive<=close)return toast('بهذا التأخير يلحق القطار، زِد الدقائق','bad');
    r.fail=true;r.failMins=mins;tl.missed=true;tl.trip0=t.id;
    hist(o,PARTNERS[r.partner].n,`السائق تأخر ${mins} دقيقة`);hist(o,'النظام',`فات الراكب قطار ${t.no}`);
    const c=newCase('مطالبة',o,NOW(),`سائق ${PARTNERS[r.partner].n} تأخر ${mins} دقيقة وفاتني القطار`,'تطبيق');c.pri='عالية';
    const d={id:'D-'+(101+S.disruptions.length),t:NOW(),type:'ride',order:o.id,ride:r,trip0:t.id,mins,done:{},caseId:c.id,op:opOf(t)};
    S.disruptions.unshift(d);audit('محاكاة: تأخر توصيلة وفوات قطار',o.id);toast('انفتحت حالة '+c.id+' تلقائياً');render();return;
  }
  const t=TRIP[u.trip];if(!t)return toast('اختر رحلة','bad');
  const os=BY_TRIP[t.id].filter(o=>o.st==='CONF'&&trainLeg(o).trip===t.id),holds=BY_TRIP[t.id].filter(o=>o.st==='HOLD').length;
  let mins=0;
  if(u.type==='cancel'){t.cancelled=true;}else{mins=Math.max(5,+u.mins||0);t.delay=mins;}
  const d={id:'D-'+(101+S.disruptions.length),t:NOW(),type:u.type,trip:t.id,mins,reason:u.reason,orders:os.map(o=>o.id),holds,done:{},op:opOf(t)};
  S.disruptions.unshift(d);audit(u.type==='cancel'?'محاكاة: إلغاء رحلة':`محاكاة: تأخير ${mins} د`,t.no);toast(`${os.length} طلب متأثر`);render();
};
function doStep(d,step){
  const I=dImpact(d),t=I.t,op=d.op;
  if(step==='notify'){notif(d.type==='cancel'?'cancel':'delay',I.os.length+d.holds,t.no);I.os.forEach(o=>hist(o,'ماسي',d.type==='cancel'?'إبلاغ العميل بإلغاء الرحلة':`إبلاغ العميل بتأخير ${d.mins} د`));d.done.notify=true;}
  else if(step==='resched'){let c=0;I.os.forEach(o=>{let k=0;if(d.type==='cancel'&&(d.done.refund||trainLeg(o).trip===t.id)){o.legs.forEach(l=>{if((l.type==='ride'||l.type==='rental')&&!l.fail&&(l.kind!=='first'||l.t>NOW())){l.cxl=true;k++;}});if(k)hist(o,'ماسي','إلغاء التوصيلات عند الشركاء');}else{k=anchorRides(o,true);if(k)hist(o,'ماسي','تعديل التوصيلات مع الشركاء حسب الموعد الجديد');}c+=k;});notif('ride',c,t.no);d.done.resched=c;}
  else if(step==='meals'){addAdj({kind:'meal',amount:I.pax*15,payer:op,status:'paid',note:'قسائم وجبات '+t.no});notif('meal',I.pax,t.no);d.done.meals=true;}
  else if(step==='comp'){let s=0;I.os.forEach(o=>{const a=r2(trainLeg(o).price*I.tier);if(a>0){addAdj({kind:'comp',order:o.id,amount:a,payer:op,note:(d.type==='cancel'?'تعويض إلغاء':'تعويض تأخير')+' حسب لائحة هيئة النقل'});hist(o,'ماسي','تعويض '+moneyT(a));s+=a;}});notif('comp',I.os.length,t.no);d.done.comp=true;}
  else if(step==='rebook'){let moved=0,left=0;I.os.forEach(o=>{const tl=trainLeg(o);const nt=TRIPS.find(x=>x.line===t.line&&x.dir===t.dir&&x.dep>t.dep&&!x.cancelled&&avail(x,tl.cls)>=o.pax);if(nt){moveOrder(o,nt);tl.trip0=t.id;hist(o,'ماسي',`إعادة حجز على ${nt.no} بسبب إلغاء ${t.no}`);moved++;}else left++;});d.done.rebook={moved,left};}
  else if(step==='refund'){I.os.forEach(o=>{const split={};o.legs.forEach(l=>{if(l.cxl)return;const p=legPayee(l,op);split[p]=r2((split[p]||0)+l.price);});o.st='CXL';releaseSeats(o);addAdj({kind:'refund',order:o.id,amount:o.total,split,payer:'MASI',note:'إلغاء من الناقل: استرداد كامل'});hist(o,'ماسي','استرداد كامل بسبب إلغاء الرحلة');});d.done.refund=true;}
  audit('خطوة عطل: '+step,d.id);
}
A.dstep=d=>{const x=S.disruptions.find(y=>y.id===d.id);if(!(can('comp')||S.role==='admin'))return toast('دورك ما يسمح','bad');doStep(x,d.step);toast('تم');render();};
A.dall=d=>{const x=S.disruptions.find(y=>y.id===d.id);if(!(can('comp')||S.role==='admin'))return toast('دورك ما يسمح','bad');dSteps(x).forEach(s=>{if(s.skip||stepDone(x,s.k))return;if(s.k==='choice')doStep(x,'rebook');else doStep(x,s.k);});toast('اكتملت كل الخطوات');render();};
A.rstep=d=>{
  const x=S.disruptions.find(y=>y.id===d.id),o=ORDER[x.order],r=x.ride,tl=trainLeg(o),p=PARTNERS[r.partner];
  if(d.step==='rebook'){const t0=TRIP[x.trip0];const nt=TRIPS.find(y=>y.line===t0.line&&y.dir===t0.dir&&y.dep>t0.dep&&!y.cancelled&&avail(y,tl.cls)>=o.pax);if(!nt)return toast('ما فيه رحلة متاحة','bad');moveOrder(o,nt);tl.trip0=t0.id;anchorRides(o,true);hist(o,'ماسي',`إعادة حجز بدون رسوم على ${nt.no}`);x.done.rebook=true;}
  if(d.step==='newride'){const other=r.partner==='JEENY'?'TAXA':'JEENY';const nt=TRIP[tl.trip];const nr=rideLeg(other,'first',stopTime(nt,tl.from)-60*MIN,tl.from);nr.addr=r.addr;o.legs.unshift(nr);o.total+=0;hist(o,'ماسي',`توصيلة بديلة مع ${PARTNERS[other].n} ${nr.ref} على حساب ماسي`);x.done.newride=`${PARTNERS[other].n} الساعة ${hhmm(nr.t)}`;nr.price=0;}
  if(d.step==='comp'){const a=r2(r.price+tl.price*.25);addAdj({kind:'comp',order:o.id,amount:a,payer:'MASI',note:'فوات قطار بسبب الشريك'});hist(o,'ماسي','تعويض '+moneyT(a));notif('comp',1,o.id);x.done.comp=true;}
  if(d.step==='recover'){const a=r2(r.price+tl.price*.25);addAdj({kind:'recovery',order:o.id,amount:a,payer:r.partner,status:'pending',note:'مطالبة حسب اتفاقية مستوى الخدمة'});hist(o,'ماسي',`مطالبة على ${p.n} بمبلغ ${moneyT(a)}`);x.done.recover=true;}
  audit('خطوة فوات قطار: '+d.step,x.id);toast('تم');render();
};

/* ================= events ================= */
let rT=null;
function onBind(el){
  const path=el.dataset.bind;let v=el.type==='checkbox'?el.checked:el.value;
  if(el.type==='number'&&v!=='')v=Number(v);
  setPath(path,v);
  const m=path.match(/^ui\.(\w+)\./);if(m&&S.ui[m[1]]&&'page' in S.ui[m[1]]&&!path.endsWith('.page'))S.ui[m[1]].page=1;
  if(HOOKS[path])HOOKS[path](v);
  if((el.dataset.on||'main')==='none')return;
  if(el.tagName==='INPUT'&&el.type!=='checkbox'){clearTimeout(rT);rT=setTimeout(render,250);}else render();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const f=A[el.dataset.action];if(f){e.preventDefault();e.stopPropagation();f(el.dataset,el);}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-bind]');if(el&&el.tagName!=='SELECT'&&el.type!=='checkbox')onBind(el);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-bind]');if(el&&(el.tagName==='SELECT'||el.type==='checkbox'))onBind(el);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.drawer)closeDrawer();if(e.key==='Enter'&&e.target.id==='gq'){S.ui.orders={q:e.target.value,line:'',status:'',ch:'',day:'',rides:false,trip:'',page:1};e.target.blur();if(!modAllowed('orders'))return toast('دورك ما يشوف الطلبات','bad');const hit=ORDER[e.target.value.trim().toUpperCase()];go('orders');if(hit)setTimeout(()=>openDrawer('order',hit.id),0);}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);S.route=V[r]?r:'ops';closeDrawer();render();window.scrollTo({top:0});});

/* ================= clock / timers ================= */
function tick(){
  const c=$('#clock');if(c){const d=new Date();c.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
  document.querySelectorAll('[data-cd]').forEach(el=>{const l=+el.dataset.cd-NOW();el.textContent=l>0?pad(Math.floor(l/MIN))+':'+pad(Math.floor(l%MIN/1000)):'انتهت';});
}
let lastFull=NOW();
setInterval(()=>{
  tick();
  let changed=false;
  ORDERS.forEach(o=>{if(o.st==='HOLD'&&o.holdUntil<=NOW()){o.st='EXP';releaseSeats(o);hist(o,'النظام','انتهت مهلة الدفع، المقاعد رجعت للبيع');audit('انتهاء حجز مؤقت',o.id,'النظام');changed=true;}});
  const typing=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
  if(!typing&&(changed||NOW()-lastFull>60000)){lastFull=NOW();render();}
},1000);

/* ================= boot ================= */
$('#roleSel').innerHTML=Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.n}</option>`).join('');
$('#roleSel').value=S.role;
S.route=V[location.hash.slice(1)]?location.hash.slice(1):'ops';
render();
window.__masi={S,ORDERS,TRIPS};
})();
</script>
